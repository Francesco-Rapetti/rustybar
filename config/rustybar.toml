# RustyBar: https://github.com/Francesco-Rapetti/rustybar
# Every key below shows its default: delete what you don't change. The bar reloads by itself when
# you save this file or a widget in widgets/*.lua.

[bar]
height = 40          # the bar; the pills are centered in it
margin = 8           # from the screen edges to the first and last pill
topmost = false      # above the macOS menu bar when it slides in
offset = 0           # moves the bar down, e.g. to try RustyBar under another bar
popup_gap = 6        # between the pills and their popups

[theme]
# The palette: catppuccin-mocha, catppuccin-macchiato, catppuccin-frappe, catppuccin-latte,
# dracula, everforest-dark, everforest-light, gruvbox-dark, gruvbox-light, kanagawa-wave,
# kanagawa-dragon, kanagawa-lotus, nord, one-dark, one-light, rose-pine, rose-pine-moon,
# rose-pine-dawn, solarized-dark, solarized-light, tokyo-night, tokyo-night-storm,
# tokyo-night-moon, tokyo-night-day. Every one has Catppuccin's color names (below).
preset = "catppuccin-mocha"
primary = "mauve"             # the accent: focused workspace, today, actions, sliders and bars
font = "Helvetica Neue"
font_size = 13
small_size = 11
icon_size = 14
pill_height = 28
pill_radius = 10
pill_border = 2
pill_padding = 10
item_gap = 8
popup_radius = 10
popup_opacity = 0.9
popup_blur = true
animations = true             # they also stop with Reduce Motion in System Settings

# Override or add palette colors, by name or hex:
# [theme.colors]
# base = "#1e1e2e"

[layout]
left = ["apple", "aerospace", "front_app"]
center = []
right = ["audio", "network", "events", "system", "battery", "clock", "notifications"]

# When the left and right sides don't fit on a screen (a small one, or beside the notch), the
# widgets farthest from their edge switch to their compact form (icons, short times), then move
# to the popup of a ⋯ pill at the inner end of their side
[displays]
compact_on_notch = false  # every widget compact on screens with a notch, even with room
hide_on_notch = []        # widgets in the ⋯ popup on screens with a notch, even with room
always_compact = []       # widgets compact on every screen
slim_first = ["audio", "claude"]  # with no room, before any widget turns compact, in this order:
                                  # audio without volume sliders, claude in one pill
large_width = 3840        # from this width a screen is "large"

# Options of each widget, by its name in [layout]:
#
# [widgets.clock]
# date = "EEE dd/MM"      # Unicode date pattern; the time follows the region of the Mac
#
# [widgets.apple]
# icon = "apple.logo"     # any SF Symbol
#
# [widgets.audio]
# sliders = true          # a slider with the volume of the output and of the input in the bar
#
# [widgets.aerospace]
# workspaces = ["1", "2", "3"]   # a fixed list; by default the ones AeroSpace knows
# hide_empty = true              # hide the empty ones, except the focused one
#
# [widgets.system]
# warning = 75            # CPU and GPU turn yellow from here
# critical = 90           # and red from here
#
# [widgets.events]
# soon = 30               # minutes before an event when its time turns yellow
# sooner = 15             # peach
# imminent = 5            # red
#
# [widgets.notifications]
# apps = ["com.tinyspeck.slackmacgap", "Mail"]   # Dock badges to count: bundle ids or Dock names
# brewfile = "~/Brewfile"  # the Homebrew packages to check for updates, every hour
# brew = true              # or all of them
#
# [widgets.home]           # the token: pbpaste | rustybar secret set home-assistant
# server = "http://homeassistant.local:8123"
# dashboard = "/"          # what "Open Home Assistant" opens: a path on the server or a URL
# watch = []               # entities Lua widgets read with rb.home.state, besides the tiles
# [[widgets.home.groups]]  # a title and its tiles, as many groups as you like
# title = "Lights"
# entities = ["light.living_room", { id = "switch.desk_lamp", name = "Desk", icon = "lightbulb" }]
# [widgets.home.printer]   # a 3D printer: a wide tile and a pill while it prints
# plug = "switch.printer"
# off = "script.printer_off"             # turns it off, at a second click
# status = "sensor.printer_status"
# progress = "sensor.printer_progress"   # %
# remaining = "sensor.printer_remaining" # hours
#
# [widgets.claude]
# color = "#d97757"       # of the account of ~/.claude
# warning = 75            # the numbers turn yellow from here
# critical = 90           # and red from here
# accounts = [{ dir = "~/.claude-work", color = "sky" }]   # more Claude Code config dirs
#
# Two widgets of the same kind: give the second a name of its own and its type.
# [widgets.clock_utc]
# type = "clock"
# timezone = "UTC"
