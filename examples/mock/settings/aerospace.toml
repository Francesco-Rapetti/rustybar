# Made-up AeroSpace config for the settings window with RUSTYBAR_MOCK (see src/settings)
config-version = 2
persistent-workspaces = ['1']
after-startup-command = [
    'exec-and-forget borders active_color="gradient(top_right=0xfff2cdcd,bottom_left=0xff89dceb)" inactive_color=0x00000000 width=14.0',
]
start-at-login = true
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
accordion-padding = 20
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = false

[key-mapping]
preset = 'qwerty'

[gaps]
inner.horizontal = 14
inner.vertical = 14
outer.left = 8
# 8 under the pills of RustyBar
outer.top = [{ monitor.built-in = 4 }, 42]
outer.bottom = 8
outer.right = 8

[mode.main.binding]
alt-enter = 'exec-and-forget open -a Terminal.app'
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'
alt-a = 'focus left'
alt-s = 'focus down'
alt-w = 'focus up'
alt-d = 'focus right'
alt-shift-a = ['move left', 'exec-and-forget rustybar msg trigger aerospace_windows']
alt-shift-d = ['move right', 'exec-and-forget rustybar msg trigger aerospace_windows']
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-tab = 'workspace-back-and-forth'
alt-shift-semicolon = 'mode service'
alt-f = ['fullscreen', 'exec-and-forget rustybar msg trigger aerospace_windows']

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main'] # reset layout

[workspace-to-monitor-force-assignment]
1 = 'main'
2 = 'secondary'

[[on-window-detected]]
if.app-id = 'com.apple.mail'
run = 'move-node-to-workspace 9'

[[on-window-detected]]
if.app-id = 'com.apple.Music'
run = 'move-node-to-workspace 2'
